<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phasmophobia — Fan Remake · 6 Tanglewood Drive</title>
<meta name="description" content="A single-file browser ghost hunting game inspired by Phasmophobia, tuned for Chromebooks.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Cpath d='M32 8c-11 0-18 9-18 20v26l6-5 6 5 6-5 6 5 6-5 6 5V28C50 17 43 8 32 8z' fill='%23d8d4c6'/%3E%3Ccircle cx='25' cy='28' r='4'/%3E%3Ccircle cx='39' cy='28' r='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@500;700&display=swap">
<style>
:root{
  --ink:#e6e1d3; --dim:#8f8b80; --faint:#55524b; --red:#c0392b; --green:#8dffa6; --amber:#ffcf6b;
  --paper:#e7dec4; --paper2:#d9cfb2; --paper-ink:#2b241b; --board:#f2f2ee;
  --type:'Special Elite','Courier New',Courier,monospace;
  --hand:'Caveat','Segoe Print','Bradley Hand','Comic Sans MS',cursive;
  --ui:system-ui,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:var(--ui);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#000}
#gl.px{image-rendering:pixelated;image-rendering:crisp-edges}
#fx-vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);z-index:2}
#fx-grain{position:fixed;inset:-64px;pointer-events:none;z-index:3;opacity:.06;will-change:transform;animation:grain .5s steps(4) infinite}
#fx-grain.off{display:none}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-37px,23px)}50%{transform:translate(29px,-41px)}75%{transform:translate(-19px,-13px)}}
#fx-red{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,rgba(120,0,0,0) 30%,rgba(120,0,0,.65) 100%);opacity:0;transition:opacity .25s}
#fade{position:fixed;inset:0;background:#000;z-index:60;pointer-events:none;opacity:0;transition:opacity .6s}
.screen{position:fixed;inset:0;z-index:10;display:none}
.screen.on{display:flex}
.btn{background:rgba(0,0,0,.35);border:1px solid rgba(230,225,211,.35);padding:.55em 1.1em;border-radius:3px;letter-spacing:.06em;transition:background .15s,border-color .15s}
.btn:hover,.btn:focus-visible{background:rgba(230,225,211,.14);border-color:var(--ink);outline:none}
.btn.primary{background:#7a1d16;border-color:#d3554a}
.btn.primary:hover{background:#9b2a20}
.btn[disabled]{opacity:.4;cursor:default}
.muted{color:var(--dim)}
kbd{display:inline-block;min-width:1.6em;padding:.05em .4em;border:1px solid currentColor;border-bottom-width:2px;border-radius:3px;font:600 .85em var(--ui);text-align:center;opacity:.9}

/* loading */
#screen-load{align-items:center;justify-content:center;flex-direction:column;background:#000;z-index:70;gap:14px}
#screen-load h1{font:400 clamp(28px,6vw,64px) var(--type);letter-spacing:.18em;margin:0;color:#d9d4c5;text-shadow:0 0 18px rgba(255,255,255,.12)}
#load-msg{font:14px var(--type);color:var(--dim)}
#load-bar{width:min(320px,70vw);height:3px;background:#222}#load-bar i{display:block;height:100%;width:0;background:#bbb;transition:width .2s}

/* title / menu */
#screen-title{align-items:stretch;background:linear-gradient(90deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.55) 38%,rgba(0,0,0,0) 70%)}
.title-col{display:flex;flex-direction:column;justify-content:center;padding:0 7vw;gap:8px;max-width:640px}
.logo{font:400 clamp(30px,6.2vw,76px) var(--type);letter-spacing:.14em;margin:0;color:#e4dfd0;text-shadow:0 0 24px rgba(255,255,255,.15),3px 3px 0 #000;animation:flick 6s infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.4}94%{opacity:1}96%{opacity:.6}97%{opacity:1}}
.sub{font:15px var(--type);color:var(--dim);letter-spacing:.12em;margin:0 0 28px}
.menu{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.menu button{background:none;border:0;padding:6px 0;font:400 clamp(18px,2.4vw,26px) var(--type);letter-spacing:.14em;color:#cfcabb;text-align:left}
.menu button:hover,.menu button:focus-visible{color:#fff;text-shadow:0 0 12px rgba(255,255,255,.5);outline:none;transform:translateX(6px)}
.menu button{transition:transform .15s,color .15s}
.legal{position:absolute;left:7vw;bottom:18px;font-size:11px;color:#6d6a62;max-width:560px;line-height:1.4}
.profile-chip{position:absolute;right:24px;top:20px;text-align:right;font:14px var(--type);color:var(--dim)}
.profile-chip b{color:var(--ink);font-weight:400}

/* lobby */
#screen-lobby{flex-direction:column;padding:2.2vh 2.2vw;gap:1.6vh;background:radial-gradient(ellipse at 50% 30%,rgba(0,0,0,0) 0%,rgba(0,0,0,.55) 80%)}
.lobby-top{display:flex;justify-content:space-between;align-items:center;font:15px var(--type);color:var(--dim);letter-spacing:.1em}
.lobby-top .money{color:var(--amber)}
.lobby-grid{flex:1;display:grid;grid-template-columns:1fr 1.15fr 1.1fr;gap:1.6vw;min-height:0}
.panel{position:relative;border-radius:4px;padding:16px 18px;min-height:0;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.panel h2{margin:0 0 10px;font-weight:400}
.board{background:var(--board);color:#1d1d1d;font-family:var(--hand);border:10px solid #9aa0a6;border-radius:6px}
.board h2{font:700 30px var(--hand);color:#1b3f8f}
.board .row{display:flex;justify-content:space-between;align-items:baseline;font-size:24px;border-bottom:1px dashed #c7c7c7;padding:3px 0}
.board .row.empty{color:#9a9a9a}
.board .ready{color:#1a7f37;font-weight:700}
.board input{font:700 24px var(--hand);border:0;border-bottom:2px solid #1b3f8f;background:transparent;color:#1d1d1d;width:60%;outline:none}
.xpbar{height:8px;background:#ddd;border-radius:4px;overflow:hidden;margin:6px 0 2px}.xpbar i{display:block;height:100%;background:#1b3f8f}
.monitor{background:#0b0f0c;border:12px solid #1d1f22;border-radius:8px;color:#bfe9c8;font-family:var(--type);box-shadow:inset 0 0 40px rgba(80,255,140,.08),0 10px 40px rgba(0,0,0,.6)}
.monitor h2{font:20px var(--type);letter-spacing:.12em;color:#d8ffe0}
.mapcard{display:flex;gap:12px;align-items:center;margin-bottom:12px;padding:10px;border:1px solid #2b3d30;background:#0f1612}
.mapcard canvas{width:132px;height:84px;image-rendering:pixelated;border:1px solid #2b3d30;background:#000}
.mapcard b{display:block;font-weight:400;font-size:18px;color:#fff}
.diffs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 10px}
.diffs button{background:#101912;border:1px solid #2b3d30;color:#9fcca9;padding:8px 2px;font:13px var(--type);border-radius:2px}
.diffs button.sel{background:#1f4b2b;color:#fff;border-color:#8dffa6}
.diffinfo{font-size:13px;line-height:1.55;color:#a9d6b4;min-height:7.5em}
.diffinfo span{color:#fff}
.clip{background:var(--paper);color:var(--paper-ink);font-family:var(--type);border-top:26px solid #6b4e2e}
.clip h2{font:22px var(--type)}
.eq{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 10px;align-items:center;font-size:14px}
.eq .h{font-size:12px;color:#6d604c;border-bottom:1px solid #b5a988;padding-bottom:2px}
.eq .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq .c{text-align:center;min-width:3.2em}
.eq button{background:#2b241b;color:#f0e8d0;border:0;border-radius:2px;padding:2px 8px;font:13px var(--type)}
.eq button[disabled]{opacity:.35}
.lobby-bottom{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.lobby-bottom .spacer{flex:1}

/* modals */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7)}
#modal.on{display:flex}
.modal-box{width:min(860px,94vw);max-height:90vh;overflow:auto;background:#141414;border:1px solid #444;border-radius:4px;padding:20px 24px;box-shadow:0 20px 60px #000}
.modal-box h2{font:400 24px var(--type);letter-spacing:.1em;margin:0 0 14px}
.modal-box h3{font:400 17px var(--type);margin:18px 0 8px;color:var(--amber)}
.modal-box p,.modal-box li{line-height:1.5;color:#cfcabb;font-size:14px}
.set-row{display:grid;grid-template-columns:200px 1fr 60px;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #262626;font-size:14px}
.set-row select,.set-row input[type=range]{width:100%}
.set-row select{background:#222;color:#eee;border:1px solid #444;padding:4px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;align-items:center}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.gcard{background:#1c1c1c;border:1px solid #333;padding:10px 12px;border-radius:3px}
.gcard b{font:400 17px var(--type);color:#fff}
.gcard .ev{font-size:12px;color:var(--green);margin:3px 0 6px}
.gcard p{margin:4px 0;font-size:13px}

/* HUD */
#hud{position:fixed;inset:0;z-index:20;pointer-events:none;display:none}
#hud.on{display:block}
#xh{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 2px #000}
#prompt{position:absolute;left:50%;top:calc(50% + 22px);transform:translateX(-50%);font:14px var(--ui);color:#eee;text-shadow:0 1px 2px #000,0 0 6px #000;white-space:nowrap}
#inv{position:absolute;right:18px;bottom:18px;display:flex;gap:6px;transition:opacity .4s}
#inv .slot{width:92px;height:46px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);border-radius:3px;display:flex;flex-direction:column;justify-content:center;align-items:center;font:11px var(--ui);color:#bbb;text-align:center;line-height:1.15;padding:2px}
#inv .slot.sel{border-color:#fff;color:#fff;background:rgba(255,255,255,.12)}
#inv .slot i{font-style:normal;font-size:10px;color:#888}
#inv .slot.on i{color:var(--green)}
#stats{position:absolute;left:16px;top:14px;font:13px var(--type);color:#cfcabb;text-shadow:0 1px 2px #000;line-height:1.5}
#stats .warn{color:#ff8a80}
#roomname{position:absolute;left:16px;bottom:16px;font:15px var(--type);color:#cfcabb;text-shadow:0 1px 3px #000;opacity:0;transition:opacity .6s}
#sub{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);font:18px var(--type);color:#fff;text-shadow:0 0 6px #000,0 1px 2px #000;text-align:center;opacity:0;transition:opacity .4s;max-width:80vw}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);font:15px var(--type);color:#eee;text-shadow:0 1px 3px #000;opacity:0;transition:opacity .4s;text-align:center}
#stam{position:absolute;left:50%;bottom:22px;width:160px;margin-left:-80px;height:3px;background:rgba(255,255,255,.12);opacity:0;transition:opacity .4s}#stam i{display:block;height:100%;background:rgba(255,255,255,.7)}
#fps{position:absolute;right:10px;top:8px;font:12px monospace;color:#8f8}
#hint{position:absolute;left:50%;top:62%;transform:translateX(-50%);font:13px var(--ui);color:#bbb;text-shadow:0 1px 2px #000;text-align:center;line-height:1.7;opacity:0;transition:opacity .8s}
#talk{position:absolute;left:24px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.72);border:1px solid #444;padding:10px 14px;font:14px var(--type);line-height:1.8;display:none;pointer-events:none}
#talk.on{display:block}
#talk div b{display:inline-block;width:1.6em;color:var(--amber);font-weight:400}

/* lock hint & pause */
#lockhint{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);font:18px var(--type);letter-spacing:.1em;cursor:pointer}
#lockhint.on{display:flex}
#pause{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72)}
#pause.on{display:flex}
#pause .menu{align-items:center}
#pause .menu button:hover{transform:none}
#hud.paused{visibility:hidden}
#pause h2{font:400 28px var(--type);letter-spacing:.2em;margin:0 0 18px;text-align:center}

/* journal */
#journal{position:fixed;inset:0;z-index:35;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#journal.on{display:flex}
.book{width:min(1040px,96vw);height:min(640px,92vh);display:flex;flex-direction:column;background:#3a2414;border-radius:8px;padding:10px;box-shadow:0 20px 60px #000}
.tabs{display:flex;gap:4px;padding:0 10px}
.tabs button{background:#8b6a43;border:0;border-radius:6px 6px 0 0;padding:6px 14px;font:14px var(--type);color:#2b1d10}
.tabs button.sel{background:var(--paper);color:#000}
.pages{flex:1;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);color:var(--paper-ink);border-radius:4px;min-height:0;font-family:var(--type);background-image:linear-gradient(90deg,transparent calc(50% - 1px),rgba(0,0,0,.25) 50%,transparent calc(50% + 1px))}
.page{padding:18px 22px;overflow:auto;min-height:0}
.page h3{margin:0 0 8px;font:400 20px var(--type);border-bottom:1px solid #b9ad8c;padding-bottom:4px}
.page p{font-size:14px;line-height:1.5;margin:6px 0}
.evrow{display:flex;align-items:center;gap:10px;padding:5px 2px;font-size:16px;cursor:pointer;border-radius:3px}
.evrow:hover{background:rgba(0,0,0,.06)}
.evbox{width:20px;height:20px;border:2px solid #2b241b;display:flex;align-items:center;justify-content:center;font:700 16px var(--ui);flex:none}
.evrow.yes .evbox{background:#2b241b;color:var(--paper)}
.evrow.no{color:#9b8f72;text-decoration:line-through}
.evrow.no .evbox{color:#a1271b;border-color:#9b8f72}
.ghostlist{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px 8px;margin-top:8px}
.ghostlist div{font-size:14px;padding:3px 6px;cursor:pointer;border-radius:3px;border:2px solid transparent}
.ghostlist div:hover{background:rgba(0,0,0,.06)}
.ghostlist div.out{color:#a89d80;text-decoration:line-through}
.ghostlist div.pick{border-color:#a1271b;border-radius:50%}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.photo{background:#fff;padding:6px 6px 4px;box-shadow:0 2px 6px rgba(0,0,0,.3);font-size:12px;text-align:center}
.photo img{width:100%;display:block;image-rendering:pixelated;background:#000;aspect-ratio:16/10;object-fit:cover}
.objs li{font-size:15px;line-height:1.6;list-style:none;margin-left:-28px}
.objs li.done{text-decoration:line-through;color:#6e8a55}
.sanbar{height:16px;background:#c9bf9f;border:1px solid #2b241b;margin:6px 0}.sanbar i{display:block;height:100%;background:#2b241b}
#jmap{width:100%;image-rendering:pixelated;background:#d7cdb0}

/* results */
#screen-results{align-items:center;justify-content:center;background:rgba(0,0,0,.82);z-index:45}
.res{width:min(720px,94vw);max-height:92vh;overflow:auto;background:var(--paper);color:var(--paper-ink);padding:24px 30px;border-radius:3px;font-family:var(--type);box-shadow:0 20px 60px #000}
.res h2{font:400 30px var(--type);margin:0 0 4px;text-align:center}
.res .verdict{text-align:center;font-size:17px;margin-bottom:14px}
.res table{width:100%;border-collapse:collapse;font-size:15px}
.res td{padding:5px 4px;border-bottom:1px dashed #b9ad8c}
.res td:last-child{text-align:right}
.res .tot td{font-size:19px;border-bottom:0;padding-top:10px}
.res .ok{color:#2e6b1f}.res .bad{color:#9b1c12}
.res .btnrow{display:flex;justify-content:center;margin-top:18px}
.res .btn{color:var(--paper-ink);border-color:#2b241b;background:transparent}
@media (max-width:820px){
  .lobby-grid{grid-template-columns:1fr;overflow:auto}
  .pages{grid-template-columns:1fr;background-image:none}
  .ghostlist{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="fx-vignette"></div>
<div id="fx-grain"></div>
<div id="fx-red"></div>

<div id="screen-load" class="screen on">
  <h1>PHASMOPHOBIA</h1>
  <div id="load-bar"><i></i></div>
  <div id="load-msg">Loading…</div>
</div>

<div id="screen-title" class="screen">
  <div class="title-col">
    <h1 class="logo">PHASMOPHOBIA</h1>
    <p class="sub">FAN REMAKE &middot; 6 TANGLEWOOD DRIVE</p>
    <div class="menu" id="main-menu">
      <button data-act="play">Play</button>
      <button data-act="howto">How to Play</button>
      <button data-act="guide">Ghost Guide</button>
      <button data-act="settings">Settings</button>
      <button data-act="about">About</button>
    </div>
  </div>
  <div class="profile-chip" id="title-profile"></div>
  <div class="legal">Fan project. Not affiliated with or endorsed by Kinetic Games. "Phasmophobia" is a trademark of its owner. All models, textures and sounds are generated in code.</div>
</div>

<div id="screen-lobby" class="screen">
  <div class="lobby-top"><span>LOBBY &middot; SOLO CONTRACT</span><span class="money" id="lobby-money"></span></div>
  <div class="lobby-grid">
    <div class="panel board" id="lobby-board"></div>
    <div class="panel monitor" id="lobby-contract"></div>
    <div class="panel clip" id="lobby-equip"></div>
  </div>
  <div class="lobby-bottom">
    <button class="btn" data-act="menu">&larr; Main menu</button>
    <button class="btn" data-act="guide">Ghost guide</button>
    <button class="btn" data-act="howto">How to play</button>
    <button class="btn" data-act="settings">Settings</button>
    <span class="spacer"></span>
    <button class="btn primary" data-act="start" id="btn-start">Ready &mdash; Start contract</button>
  </div>
</div>

<div id="hud">
  <div id="xh"></div>
  <div id="prompt"></div>
  <div id="stats"></div>
  <div id="roomname"></div>
  <div id="sub"></div>
  <div id="toast"></div>
  <div id="hint"></div>
  <div id="stam"><i></i></div>
  <div id="inv"></div>
  <div id="talk"></div>
  <div id="fps"></div>
</div>

<div id="lockhint">CLICK TO CONTINUE</div>

<div id="pause">
  <div>
    <h2>PAUSED</h2>
    <div class="menu">
      <button data-act="resume">Resume</button>
      <button data-act="journal">Journal</button>
      <button data-act="settings">Settings</button>
      <button data-act="howto">Controls</button>
      <button data-act="abandon">Abandon contract</button>
    </div>
  </div>
</div>

<div id="journal">
  <div class="book">
    <div class="tabs" id="jtabs"></div>
    <div class="pages" id="jpages"></div>
  </div>
</div>

<div id="screen-results" class="screen"><div class="res" id="res"></div></div>
<div id="modal"><div class="modal-box" id="modal-box"></div></div>
<div id="fade"></div>
<noscript><p style="padding:20px">This game needs JavaScript.</p></noscript>

<script type="module">
// =============================================================================
// PHASMOPHOBIA — fan remake, single file. Map: 6 Tanglewood Drive.
// Sections: BOOT · UTIL · SAVE · DATA · AUDIO · GFX · WORLD · ITEMS · GHOST ·
//           GAME · UI · LOBBY SCENE · MAIN LOOP
// =============================================================================

// ---------------------------------------------------------------- BOOT ------
const $ = (s, el = document) => el.querySelector(s);
const setLoad = (msg, frac) => { $('#load-msg').textContent = msg; if (frac != null) $('#load-bar i').style.width = (frac * 100) + '%'; };
const nextFrame = () => new Promise((r) => requestAnimationFrame(() => r()));

async function loadThree() {
  // The copy next to this file first (GitHub Pages / any web server), then public
  // CDNs, so index.html also works on its own when opened straight from disk.
  const sources = [
    './vendor/three.module.js',
    'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js',
    'https://unpkg.com/three@0.170.0/build/three.module.js',
  ];
  for (const src of sources) {
    try { return await import(src); } catch (e) { console.info('three.js not available from', src); }
  }
  throw new Error('Could not load three.js. Check your internet connection and reload.');
}
{ // film grain tile (a small PNG made once; cheaper than an SVG filter)
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); const d = g.createImageData(128, 128);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255 | 0; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); $('#fx-grain').style.backgroundImage = `url(${c.toDataURL()})`;
}

function loadSave() {
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (raw && typeof raw === 'object') {
      SAVE.settings = { ...DEFAULT_SETTINGS, ...(raw.settings || {}) };

  if (!SAVE.profile) SAVE.profile = freshProfile();
  const p = SAVE.profile;
  p.owned = p.owned || {};
  for (const [id, it] of Object.entries(ITEMS)) {
    if (typeof p.owned[id] !== 'number') p.owned[id] = it.start;
    if (it.core) p.owned[id] = Math.max(1, p.owned[id]);
  }
  p.stats = p.stats || { contracts: 0, deaths: 0, correct: 0 };

// Every sound is synthesised with WebAudio. Positional sounds go through a
// panner plus a low-pass "occlusion" filter so noises in other rooms or on
// another floor sound muffled.
const AudioSys = {
  ctx: null, master: null, sfx: null, amb: null, verb: null, noiseBuf: null, brownBuf: null,
  occluder: null, loops: [],
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = this.ctx = new AC();
    this.master = ctx.createGain();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    this.master.connect(comp).connect(ctx.destination);
    this.sfx = ctx.createGain(); this.sfx.connect(this.master);
    this.amb = ctx.createGain(); this.amb.connect(this.master);
    // small generated reverb used by ghost sounds
    const len = Math.floor(ctx.sampleRate * 1.3);
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    this.verb = ctx.createConvolver(); this.verb.buffer = ir;
    const vg = ctx.createGain(); vg.gain.value = 0.55; this.verb.connect(vg).connect(this.master);
    const mk = (n, f) => { const b = ctx.createBuffer(1, n, ctx.sampleRate); f(b.getChannelData(0)); return b; };
    this.noiseBuf = mk(ctx.sampleRate * 2, (d) => { for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; });
    this.brownBuf = mk(ctx.sampleRate * 4, (d) => { let l = 0; for (let i = 0; i < d.length; i++) { l = (l + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = l * 3.5; } });
    this.setVolume(SAVE.settings.volume);
    this.buildLoops();
  },
  get t() { return this.ctx ? this.ctx.currentTime : 0; },
  setVolume(v) { if (this.master) this.master.gain.value = v; },
  listen(cam) {
    if (!this.ctx) return;
    const L = this.ctx.listener, p = cam.getWorldPosition(_v1), f = cam.getWorldDirection(_v2);
    if (L.positionX) {
      const t = this.t;
      L.positionX.setTargetAtTime(p.x, t, 0.02); L.positionY.setTargetAtTime(p.y, t, 0.02); L.positionZ.setTargetAtTime(p.z, t, 0.02);
      L.forwardX.setTargetAtTime(f.x, t, 0.02); L.forwardY.setTargetAtTime(f.y, t, 0.02); L.forwardZ.setTargetAtTime(f.z, t, 0.02);
      L.upX.value = 0; L.upY.value = 1; L.upZ.value = 0;
    } else { L.setPosition(p.x, p.y, p.z); L.setOrientation(f.x, f.y, f.z, 0, 1, 0); }
  },
  // returns the node to connect a sound into; routes to the right place
  out(pos, o = {}) {
    const ctx = this.ctx;
    const g = ctx.createGain(); g.gain.value = o.outGain ?? 1;
    let head = g;
    if (pos) {
      const occ = this.occluder ? this.occluder(pos) : 0;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = occ > 0 ? lerp(4200, 700, occ) : 20000;
      const p = ctx.createPanner();
      p.panningModel = 'equalpower'; p.distanceModel = 'inverse';
      p.refDistance = o.ref ?? 1.4; p.rolloffFactor = o.roll ?? 1.25; p.maxDistance = 60;
      if (p.positionX) { p.positionX.value = pos.x; p.positionY.value = pos.y; p.positionZ.value = pos.z; } else p.setPosition(pos.x, pos.y, pos.z);
      g.connect(lp).connect(p).connect(this.sfx);
      if (o.verb) { const s = ctx.createGain(); s.gain.value = o.verb; p.connect(s).connect(this.verb); }
      if (occ > 0) g.gain.value *= lerp(1, 0.45, occ);
    } else {
      g.connect(this.sfx);
      if (o.verb) { const s = ctx.createGain(); s.gain.value = o.verb; g.connect(s).connect(this.verb); }
    }
    return head;
  },
  env(param, t, a, peak, d, end = 0.0001) {
    param.cancelScheduledValues(t);
    param.setValueAtTime(0.0001, t);
    param.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a);
    param.exponentialRampToValueAtTime(end, t + a + d);
  },
  noise(o) {
    if (!this.ctx) return;
    const ctx = this.ctx, t = this.t + (o.delay || 0);
    const src = ctx.createBufferSource(); src.buffer = o.brown ? this.brownBuf : this.noiseBuf;
    src.playbackRate.value = o.rate || 1;
    const f = ctx.createBiquadFilter(); f.type = o.type || 'bandpass'; f.frequency.value = o.freq || 1000; f.Q.value = o.q ?? 1;
    if (o.freqEnd) f.frequency.exponentialRampToValueAtTime(o.freqEnd, t + (o.a || 0.005) + (o.d || 0.1));
    const g = ctx.createGain();
    this.env(g.gain, t, o.a || 0.005, o.gain || 0.5, o.d || 0.1);
    src.connect(f).connect(g).connect(this.out(o.pos, o));
    src.start(t, Math.random() * 1.5); src.stop(t + (o.a || 0.005) + (o.d || 0.1) + 0.05);
  },
  tone(o) {
    if (!this.ctx) return;
    const ctx = this.ctx, t = this.t + (o.delay || 0);
    const osc = ctx.createOscillator(); osc.type = o.wave || 'sine'; osc.frequency.value = o.freq || 440;
    if (o.freqEnd) osc.frequency.exponentialRampToValueAtTime(o.freqEnd, t + (o.a || 0.005) + (o.d || 0.2));
    if (o.vib) { const l = ctx.createOscillator(); l.frequency.value = o.vibRate || 5; const lg = ctx.createGain(); lg.gain.value = o.vib; l.connect(lg).connect(osc.frequency); l.start(t); l.stop(t + (o.a || 0.005) + (o.d || 0.2) + 0.1); }

  },
  // looping sources: ambience, spirit box static, hunt drone, smudge crackle…
  loop(build) { const L = build(this.ctx); L.gain.gain.value = 0; this.loops.push(L); return L; },
  buildLoops() {
    const ctx = this.ctx;
    const noiseLoop = (buf, type, freq, q, dest) => {
      const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
      const gain = ctx.createGain(); src.connect(f).connect(gain).connect(dest); src.start();
      return { src, f, gain };
    };
    this.wind = this.loop(() => { const L = noiseLoop(this.brownBuf, 'lowpass', 500, 0.5, this.amb); return L; });
    this.roomTone = this.loop(() => noiseLoop(this.brownBuf, 'lowpass', 140, 0.7, this.amb));
    this.vanHum = this.loop(() => {
      const L = noiseLoop(this.brownBuf, 'lowpass', 220, 1, this.amb);
      const o = ctx.createOscillator(); o.frequency.value = 58; const og = ctx.createGain(); og.gain.value = 0.15; o.connect(og).connect(L.gain); o.start();

class Door {

  }

// o.dw: door width (centred, panels either side); o.frame: those panels' material;
// o.cap: fills the space above it up to the ceiling, for closets built into a wall
class Closet {
  constructor(name, x0, z0, x1, z1, face = 'S', y = 0, mat = M.darkwood, doorMat = M.louver, o = {}) {
    this.name = name; this.y = y;
    this.rect = [x0 + 0.08, z0 + 0.08, x1 - 0.08, z1 - 0.08];
    const t = 0.06, h = 2.1, fm = o.frame || mat;
    const solid = (a0, b0, a1, b1, m = mat) => { SB.box(m, a0, y, b0, a1, y + h, b1); addCol(a0, a1, b0, b1, y, y + h); };
    SB.box(mat, x0, y + h, z0, x1, y + h + 0.05, z1);
    if (o.cap) SB.box(o.cap, x0, y + h + 0.05, z0, x1, y + H, z1, FACE.PY);
    if (face !== 'N') solid(x0, z0, x1, z0 + t);
    if (face !== 'S') solid(x0, z1 - t, x1, z1);
    if (face !== 'W') solid(x0, z0, x0 + t, z1);
    if (face !== 'E') solid(x1 - t, z0, x1, z1);
    const doorW = (span) => Math.min(o.dw || span - 0.2, span - 0.2);
    if (face === 'N' || face === 'S') {
      const zf = face === 'S' ? z1 - t / 2 : z0 + t / 2, dw = doorW(x1 - x0), sd = (x1 - x0 - dw) / 2;
      solid(x0, zf - t / 2, x0 + sd, zf + t / 2, fm); solid(x1 - sd, zf - t / 2, x1, zf + t / 2, fm);
      this.door = new Door({ name, axis: 'x', hinge: [x0 + sd, y, zf], width: dw, height: 2.0, swing: face === 'S' ? 1 : -1, mat: doorMat, closet: this });
      this.front = V3((x0 + x1) / 2, y, face === 'S' ? z1 + 0.5 : z0 - 0.5);
    } else {
      const xf = face === 'E' ? x1 - t / 2 : x0 + t / 2, dw = doorW(z1 - z0), sd = (z1 - z0 - dw) / 2;
      solid(xf - t / 2, z0, xf + t / 2, z0 + sd, fm); solid(xf - t / 2, z1 - sd, xf + t / 2, z1, fm);
      this.door = new Door({ name, axis: 'z', hinge: [xf, y, z0 + sd], width: dw, height: 2.0, swing: face === 'E' ? 1 : -1, mat: doorMat, closet: this });
      this.front = V3(face === 'E' ? x1 + 0.5 : x0 - 0.5, y, (z0 + z1) / 2);
    }
    WORLD.closets.push(this);
  }
  contains(p, feetY) { return Math.abs(feetY - this.y) < 0.6 && p.x > this.rect[0] && p.x < this.rect[2] && p.z > this.rect[1] && p.z < this.rect[3]; }
}

function computeRewards(died) {
  const D = DIFFS[GAME.diff], g = GAME.ghost, p = SAVE.profile;
  const rows = [];
  const correct = GAME.guess === g.type.id;
  const base = correct ? 30 : 0;
  rows.push([`Ghost type: ${correct ? 'correct' : 'incorrect'}`, base]);
  const objs = GAME.obj.map((o) => [OBJECTIVES[o.id].text, o.done ? 10 : 0, o.done]);
  for (const o of objs) rows.push([o[0], o[1]]);
  const seen = new Set(); let photoTotal = 0;
  for (const ph of GAME.photos) { if (!ph.stars || seen.has(ph.label)) continue; seen.add(ph.label); photoTotal += { 1: 3, 2: 6, 3: 10 }[ph.stars]; }
  rows.push([`Photos (${seen.size} unique)`, photoTotal]);
  rows.push(['Bone', GAME.boneFound ? 10 : 0]);
  let sub = rows.reduce((a, r) => a + r[1], 0);
  const total = Math.round(sub * D.mult * (died ? 0.5 : 1));
  // the van carries the host's equipment (multiplied for the team), so only the
  // host pays for what was used up, and for what was lost if the host died
  const lost = {};
  if (NET.role !== 'client') {
    const lo = GAME.loadout();
    for (const [id, n] of Object.entries(GAME.consumed)) lost[id] = Math.min(lo[id] || 0, Math.ceil(n / GAME.players));
    if (died) for (const [id, n] of Object.entries(lo)) { const keep = Math.round(n * D.insurance); lost[id] = Math.max(lost[id] || 0, n - keep); }
    for (const [id, n] of Object.entries(lost)) { if (n > 0) p.owned[id] = Math.max(ITEMS[id].core ? 1 : 0, (p.owned[id] || 0) - n); else delete lost[id]; }
  }
  const xp = Math.round((40 + (correct ? 60 : 0) + objs.filter((o) => o[2]).length * 20 + photoTotal) * D.mult * (died ? 0.5 : 1));
  const lvBefore = levelFromXp(p.xp);
  p.money += total; p.xp += xp; p.stats.contracts++; if (died) p.stats.deaths++; if (correct) p.stats.correct++;
  persist();
  return { died, correct, ghost: g, guess: GAME.guess, rows, mult: D.mult, total, xp, levelUp: levelFromXp(p.xp) > lvBefore, lost, diff: D.name };
}

  const give = (it) => {
    if (it.where === 'world') { it.mesh.parent && it.mesh.parent.remove(it.mesh); DOTS.clear(it); }

    case 'door': { const d = WORLD.doors[m.i]; if (d) d.playerToggle(); break; }

    case 'vandoor': VAN.doors.set(!VAN.doors.open); break;
    case 'take': {

    case 'pick': { const it = item(m.id); if (it && it.where === 'world') give(it); break; }
    case 'drop': {

    }
    case 'rack': {

      if (it.def.toggle && it.on) it.setOn(false, false);
      GAME.returnToRack(it); break;
    }
    case 'toggle': { const it = item(m.id); if (it && it.where === 'world' && it.def.toggle) { it.setOn(!it.on, false); wfx('click', it.mesh.position); } break; }

    case 'smudge': {

      GAME.used('smudge'); break;
    }
    case 'consume': { const it = item(m.id); if (it && it.holder === rp.pid) removeItem(it); break; }
    case 'pills': {
      const it = item(m.id); if (!it || it.holder !== rp.pid) break;
      removeItem(it); rp.sanity = Math.min(100, rp.sanity + DIFFS[GAME.diff].pills); GAME.used('pills'); break;
    }
    case 'bone': if (GAME.bone.visible && GAME.bone.position.distanceTo(rp.pos) < 3.5) { GAME.boneFound = true; GAME.bone.visible = false; } break;
    case 'say': GAME.sayFrom(rp, m.ph, m.box); break;
    case 'saw': if (GAME.ghost) GAME.ghost.remoteSaw(rp, m.s); break;
    case 'obj': if (['emf', 'cold', 'photo', 'event'].includes(m.id)) GAME.objective(m.id); break;
    case 'leave': if (GAME.hunt) NET.toastTo(rp, 'The van doors won’t close during a hunt!'); else GAME.endContract(); break;
    // a guest quit to the lobby but stays connected (they can rejoin)
    case 'quit': dropGearOf(rp); rp.away = true; rp.av.root.visible = false; NET.toastAll(`${rp.name} left the contract`); break;

}
// a guest receives an item from the host (picked up or taken from the rack)
function clientGotItem(m) {
  let it = ITEM_LIST.find((x) => x.id === m.id);
  if (it && it.where === 'world') { it.mesh.parent && it.mesh.parent.remove(it.mesh); DOTS.clear(it); }
  if (!it) it = new Item(m.type, m.id);
  it.applyState(m.s);
  if (freeSlot() < 0) { // no room after all: put it straight back down
    const spot = placementSpot(); placeInWorld(it, spot, PLAYER.yaw); it.pendingT = GAME.time + 2;
    NET.action({ k: 'drop', id: it.id, x: r2(spot.x), y: r2(spot.y), z: r2(spot.z), ry: r2(PLAYER.yaw), s: it.netState() });
    return;
  }
  for (const s of VAN.rackSlots) { const i = s.items ? s.items.indexOf(it) : -1; if (i >= 0) { s.items.splice(i, 1); GAME.refreshRack(); } }

}

// ---- snapshots: the host's world, ~12 times a second ----
GAME.snapshot = function () {
  const g = this.ghost;
  const gf = (g.m.root.visible ? 1 : 0) | (g.hunt ? 2 : 0) | (g.event ? 4 : 0) | (g.event && g.event.type === 'chase' ? 8 : 0) | (g.dots.root.visible ? 16 : 0) | (g.hunt && g.hunt.grace < 3 ? 32 : 0) | (g.event && g.event.ball ? 64 : 0);
  const s = {
    t: 's', tm: r2(this.time), su: Math.ceil(this.setupLeft), br: this.breaker ? 1 : 0, vd: VAN.doors.open ? 1 : 0,
    g: [r2(g.pos.x), r2(g.pos.y), r2(g.pos.z), r2(g.yaw), gf, r2(g.speed), r2(g.m.body.scale.x / g.m.scale), g.eventSerial],
    pl: PL.all().concat([...REMOTES.values()].filter((r) => r.away)).map((p) => {
      const h = p === PLAYER ? PLAYER.held() : null;
      const held = p === PLAYER ? (h ? ITEM_ORDER.indexOf(h.type) : -1) : (p.held ? ITEM_ORDER.indexOf(p.held) : -1);
      const on = p === PLAYER ? (h && h.on ? 1 : 0) : p.heldOn ? 1 : 0;
      const f = (p.flashOn ? 1 : 0) | (p.crouch ? 2 : 0) | (p.dead ? 4 : 0) | (p.away ? 16 : 0);
      return [p.pid, r2(p.pos.x), r2(p.pos.y), r2(p.pos.z), r2(p.yaw), r2(p.pitch || 0), f, held, on, Math.round(p.sanity)];
    }),
    d: WORLD.doors.map((d) => [Math.round(d.target * 100), Math.round(d.speed * 10), d.locked ? 1 : 0]),
    sw: ROOMS.map((r) => (r.switchOn ? 1 : 0)).join(''),
    fl: [...this.flicker.keys()].map((r) => ROOMS.indexOf(r)),
    tp: ROOMS.map((r) => Math.round(r.tempNow * 10)),
    em: this.emf.map((e) => [r2(e.pos.x), r2(e.pos.y), r2(e.pos.z), e.level]),
    pp: WORLD.props.map((p) => { const m = p.mesh; return [r2(m.position.x), r2(m.position.y), r2(m.position.z), r2(m.rotation.x), r2(m.rotation.y), r2(m.rotation.z)]; }),
    it: ITEM_LIST.filter((it) => it.where === 'world').map((it) => [it.id, ITEM_ORDER.indexOf(it.type), r2(it.placePos.x), r2(it.placePos.y), r2(it.placePos.z), r2(it.placeYaw), (it.on ? 1 : 0) | (it.lit ? 2 : 0), it.uses, it.written || 0]),
    rk: VAN.rackSlots.map((sl, i) => (sl.type ? [i, ITEM_ORDER.indexOf(sl.type), sl.items.map((x) => x.id)] : null)).filter(Boolean),
    sa: SALT.map((x) => [r2(x.pos.x), r2(x.pos.y), r2(x.pos.z), x.stepped ? 1 : 0]),
    ob: this.obj.map((o) => (o.done ? 1 : 0)).join(''), bn: this.boneFound ? 1 : 0,
    or: this.orbRoom ? ROOMS.indexOf(this.orbRoom) : -1,
  };
  if (g.event && g.event.ball) s.ab = g.event.ball.position.toArray().map(r2);
  return s;
};
GAME.applySnapshot = function (s) {
  this.setupLeft = s.su; this.time = Math.max(this.time, s.tm - 0.2);
  if (!!s.br !== this.breaker) this.applyBreaker(!!s.br);
  if (!!s.vd !== VAN.doors.open) VAN.doors.target = s.vd ? 1 : 0;
  // ghost
  const g = this.ghost, [gx, gy, gz, gyaw, gf, gsp, gsc, serial] = s.g;
  g.netPos.set(gx, gy, gz); g.netYaw = gyaw; g.speed = gsp; g.eventSerial = serial;
  g.m.root.visible = g.visible = !!(gf & 1);
  g.hunt = gf & 2 ? (g.hunt || {}) : null; if (g.hunt) g.hunt.grace = gf & 32 ? 0 : 3.2;
  g.event = gf & 4 ? { type: gf & 8 ? 'chase' : 'appear' } : null;
  g.dots.root.visible = !!(gf & 16);
  g.glow(g.hunt ? 1 : g.event ? 0.55 : 0);
  g.m.body.scale.setScalar(g.m.scale * gsc);
  if (s.ab) {
    if (!g.airball) { g.airball = makeAirball(V3(...s.ab)); g.airball.userData.net = V3(...s.ab); }
    g.airball.userData.net.set(...s.ab); g.airball.visible = true;
  } else if (g.airball) { WORLD.scene.remove(g.airball); g.airball = null; }
  // players
  const here = new Set();
  for (const [pid, x, y, z, yaw, pitch, f, held, on, san] of s.pl) {
    if (pid === NET.myPid) {
      PLAYER.sanity = san;
      if (f & 4 && !PLAYER.dead) { PLAYER.dead = true; PLAYER.spectating = true; }
      continue;
    }
    here.add(pid);
    let rp = REMOTES.get(pid);
    if (!rp) { const lp = NET.lobby.find((x) => x.pid === pid); rp = new RemotePlayer(pid, lp ? lp.name : null); REMOTES.set(pid, rp); }
    rp.pose([x, y, z, yaw, pitch, f, held, on]); rp.dead = !!(f & 4); rp.away = !!(f & 16); rp.sanity = san;
  }
  for (const [pid, rp] of REMOTES) if (!here.has(pid)) { rp.dispose(); REMOTES.delete(pid); }
  // doors, lights, temperatures, emf
  s.d.forEach(([t, sp, lk], i) => { const d = WORLD.doors[i]; if (!d) return; d.locked = !!lk; if (Math.abs(d.target - t / 100) > 0.005) { d.target = t / 100; d.speed = sp / 10; } });
  ROOMS.forEach((r, i) => { const on = s.sw[i] === '1'; if (on !== r.switchOn) { r.switchOn = on; (r.switches || []).forEach((sw) => sw.sync()); } r.tempNow = s.tp[i] / 10; });
  for (const i of s.fl) this.flickerRoom(ROOMS[i], 0.25);
  this.emf = s.em.map(([x, y, z, l]) => ({ pos: V3(x, y, z), level: l, life: 1 }));
  this.orbRoom = s.or >= 0 ? ROOMS[s.or] : null;
  // props
  s.pp.forEach(([x, y, z, rx, ry, rz], i) => { const p = WORLD.props[i]; if (!p) return; if (!p.net) p.net = { pos: V3(), rot: [0, 0, 0] }; p.net.pos.set(x, y, z); p.net.rot = [rx, ry, rz]; });
  // items lying in the house
  const seen = new Set();
  for (const [id, ti, x, y, z, ry, f, u, w] of s.it) {
    seen.add(id);
    let it = ITEM_LIST.find((x2) => x2.id === id);
    if (it && it.where === 'hand') continue;
    if (!it) it = new Item(ITEM_ORDER[ti], id);
    if (it.where !== 'world' || !it.placePos || Math.abs(it.placePos.x - x) + Math.abs(it.placePos.y - y) + Math.abs(it.placePos.z - z) > 0.02 || Math.abs((it.placeYaw ?? 0) - ry) > 0.02) {
      if (it.where === 'rack') for (const sl of VAN.rackSlots) { const k = sl.items ? sl.items.indexOf(it) : -1; if (k >= 0) sl.items.splice(k, 1); }
      placeInWorld(it, V3(x, y, z), ry);
    }
    it.applyState({ on: f & 1, u, w, l: f & 2 ? 1 : 0 });
  }
  for (const it of [...ITEM_LIST]) if (it.where === 'world' && !seen.has(it.id) && !(it.pendingT > this.time)) removeItem(it);
  // the van rack
  const rk = JSON.stringify(s.rk);
  if (rk !== this.lastRack) {
    this.lastRack = rk;
    const onRack = new Set();
    for (const sl of VAN.rackSlots) { sl.type = null; sl.items = []; }
    for (const [i, ti, ids] of s.rk) {
      const sl = VAN.rackSlots[i]; sl.type = ITEM_ORDER[ti];
      sl.items = ids.map((id) => { onRack.add(id); let it = ITEM_LIST.find((x) => x.id === id); if (it && it.where === 'hand') return null; if (!it) it = new Item(sl.type, id); if (it.where === 'world') { it.mesh.parent && it.mesh.parent.remove(it.mesh); DOTS.clear(it); } it.where = 'rack'; return it; }).filter(Boolean);
    }
    for (const it of [...ITEM_LIST]) if (it.where === 'rack' && !onRack.has(it.id)) removeItem(it);
    this.refreshRack();
  }
  // salt piles
  s.sa.forEach(([x, y, z, st], i) => {
    let p = SALT[i];
    if (!p) { const mesh = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.05, 7), M.white); mesh.position.set(x, y + 0.025, z); mesh.castShadow = false; WORLD.scene.add(mesh); p = { pos: V3(x, y, z), mesh, stepped: false }; SALT.push(p); }
    if (st && !p.stepped) { p.stepped = true; p.mesh.scale.y = 0.25; }
  });
  // objectives and the bone
  this.obj.forEach((o, i) => { const done = s.ob[i] === '1'; if (done && !o.done) { o.done = true; this.boardDirty = true; HUD.toast('Objective complete: ' + OBJECTIVES[o.id].text); } });
  if (s.bn && !this.boneFound) { this.boneFound = true; this.bone.visible = false; }
  // one-off events: sounds and fingerprints
  for (const [type, d] of s.ev || []) {
    if (type === 'fx') { const [name, x, y, z, ...args] = d; if (SFX[name]) SFX[name](V3(x, y, z), ...args); }
    else if (type === 'pt') makePrint(d[0], d[1], d[2]);
  }
};

const HUD = {
  toastT: 0, subT: 0, roomT: 0, lastRoom: undefined, hintT: 0, invT: 0, cache: {},
  set(id, html) { if (this.cache[id] === html) return; this.cache[id] = html; $('#' + id).innerHTML = html; },
  toast(msg, t = 3.2) { const e = $('#toast'); e.textContent = msg; e.style.opacity = 1; this.toastT = t; },
  sub(msg, t = 3) { const e = $('#sub'); e.textContent = msg; e.style.opacity = 1; this.subT = t; },
  hint(html, t = 14) { const e = $('#hint'); e.innerHTML = html; e.style.opacity = 1; this.hintT = t; },
  fade(id, key) { if (this[key] > 0) return; if (this[key + 'Off']) return; this[key + 'Off'] = true; $('#' + id).style.opacity = 0; },
  inv(flash) {
    const box = $('#inv');
    box.innerHTML = PLAYER.inv.map((it, i) => `<div class="slot${i === PLAYER.sel ? ' sel' : ''}${it && (it.on || it.lit) ? ' on' : ''}">${it ? esc(it.def.name) : '<span style="opacity:.4">empty</span>'}<i>${i + 1}${it && it.def.toggle ? (it.on ? ' · ON' : ' · off') : it && it.type === 'salt' ? ' · ' + it.uses + ' left' : it && it.type === 'smudge' && it.lit ? ' · burning' : ''}</i></div>`).join('');
    box.style.opacity = 1; this.invT = flash ? 3 : 6;

  showTalk() {

    $('#talk').innerHTML = '<div style="color:#999;margin-bottom:4px">SAY (number key)</div>' + PHRASES.map((p, i) => `<div><b>${i + 1}</b>${esc(p.k === 'name' && GAME.ghost ? `"${GAME.ghost.first}…?" (ghost's name)` : p.text)}</div>`).join('') + '<div style="color:#777;margin-top:4px"><b>T</b>close</div>';
    $('#talk').classList.add('on');
  },
  hideTalk() { INPUT.talkOpen = false; $('#talk').classList.remove('on'); },
  update(dt) {
    const S = SAVE.settings;
    for (const [id, key] of [['toast', 'toastT'], ['sub', 'subT'], ['hint', 'hintT'], ['roomname', 'roomT']]) {
      if (this[key] > 0) { this[key] -= dt; this[key + 'Off'] = false; } else this.fade(id, key);
    }
    if (this.invT > 0 && (this.invT -= dt) <= 0) $('#inv').style.opacity = 0.45;
    const aim = PLAYER.dead ? null : updateAim();
    this.set('prompt', S.prompts ? promptFor(aim) : '');
    if (PLAYER.room !== this.lastRoom) {

    else if (S.showSanity) st += `<div class="${GAME.sanity < 40 ? 'warn' : ''}">Sanity ${Math.round(GAME.sanity)}%</div>`;
    if (GAME.setupLeft > 0) st += `<div>Setup ${fmtTime(GAME.setupLeft)}</div>`;
    if (!GAME.breaker) st += '<div class="warn">Power off</div>';
    this.set('stats', st);

      this.cache.stam = sk;

    }
  },
};

    if (s === 'lobby') { $('#screen-lobby').classList.add('on'); lobbyRender(); }
    if (s === 'results') { $('#screen-results').classList.add('on'); document.exitPointerLock && document.exitPointerLock(); }
    if (s !== 'game') { this.setPaused(false); $('#lockhint').classList.remove('on'); JOURNAL.hide(); HUD.hideTalk(); }
  },
  titleAmbience() {
    GAME.active = false; GAME.breaker = true; GAME.hunt = null;
    for (const r of ROOMS) r.switchOn = r.id === 'living' || r.id === 'boys' || r.id === 'foyer';
    for (const d of WORLD.doors) { d.angle = d.target = 0; d.pivot.rotation.y = d.rot(); d.locked = false; d.col.off = false; }
    const fd = WORLD.frontDoor; fd.angle = fd.target = 0.35; fd.pivot.rotation.y = fd.rot();
    if (GAME.ghost) { GAME.ghost.show(false); }
    VAN.doors.snap(false);
  },
  startContract() {
    if (NET.role === 'client') return;
    if (NET.lobby.some((x) => !x.host && !x.ready)) { HUD.toast('Waiting for everyone to click Ready'); return; }
    AudioSys.init();
    SAVE.profile.name = ($('#pname') && $('#pname').value.trim()) || SAVE.profile.name; persist();
    $('#fade').style.opacity = 1;
    setTimeout(() => {
      GAME.start(SAVE.diff);
      this.setState('game');
      HUD.inv(); HUD.lastRoom = undefined;
      HUD.hint('<kbd>WASD</kbd> move &nbsp; <kbd>Mouse</kbd> look &nbsp; <kbd>E</kbd> interact / take gear from the rack &nbsp; <kbd>F</kbd> flashlight<br><kbd>1</kbd>-<kbd>3</kbd> items &nbsp; <kbd>Click</kbd> use &nbsp; <kbd>G</kbd> drop &nbsp; <kbd>T</kbd> talk &nbsp; <kbd>J</kbd> journal &nbsp; <kbd>Esc</kbd> pause', 16);
      HUD.toast(`Contract: 6 Tanglewood Drive — ${DIFFS[GAME.diff].name}. Grab equipment from the rack.`, 5);
      $('#fade').style.opacity = 0;
      this.askLock();
    }, 650);
  },
  startClient(info) {
    AudioSys.init();
    $('#fade').style.opacity = 1;
    setTimeout(() => {
      GAME.startClient(info);
      this.setState('game');
      HUD.inv(); HUD.lastRoom = undefined;
      HUD.hint('<kbd>WASD</kbd> move &nbsp; <kbd>Mouse</kbd> look &nbsp; <kbd>E</kbd> interact / take gear from the rack &nbsp; <kbd>F</kbd> flashlight<br><kbd>1</kbd>-<kbd>3</kbd> items &nbsp; <kbd>Click</kbd> use &nbsp; <kbd>G</kbd> drop &nbsp; <kbd>T</kbd> talk &nbsp; <kbd>J</kbd> journal &nbsp; <kbd>Esc</kbd> pause', 12);
      HUD.toast(`Playing with ${NET.hostCode}: 6 Tanglewood Drive — ${DIFFS[GAME.diff].name}.`, 5);
      $('#fade').style.opacity = 0;
      this.askLock();
    }, 400);
  },
  askLock() {
    if (this.state !== 'game' || this.paused || JOURNAL.open) return;
    try {
      const pr = canvas.requestPointerLock();
      if (pr && pr.catch) pr.catch(() => $('#lockhint').classList.add('on'));
    } catch (e) { $('#lockhint').classList.add('on'); }
    setTimeout(() => { if (this.state === 'game' && !INPUT.locked && !this.paused && !JOURNAL.open) $('#lockhint').classList.add('on'); }, 400);
  },
  setPaused(p) {
    this.paused = p; $('#pause').classList.toggle('on', p); $('#hud').classList.toggle('paused', p);
    if (p) {
      HUD.hideTalk(); for (const k in KEYS) KEYS[k] = false;
      if (AudioSys.ctx && NET.role !== 'client' && !NET.guestCount()) AudioSys.ctx.suspend();
      // the menu needs a free mouse pointer, however the pause was triggered
      if (INPUT.locked) { INPUT.expectUnlock = true; document.exitPointerLock && document.exitPointerLock(); }
    }
    else if (AudioSys.ctx) AudioSys.ctx.resume();
  },
  applyScale() {
    renderer.setPixelRatio(this.scale);
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    if (LOBBY.cam) { LOBBY.cam.aspect = camera.aspect; LOBBY.cam.updateProjectionMatrix(); }
  },
  applySettings(recompile) {
    const S = SAVE.settings;
    if (S.quality !== 'auto') this.scale = parseFloat(S.quality);
    this.applyScale();
    camera.fov = S.fov; camera.updateProjectionMatrix();
    U.uPS1.value = S.ps1 ? 1 : 0; U.uSnap.value.x = S.wobble ? 220 : 0; U.uBright.value = 1 / clamp(S.bright || 1, 0.5, 3);
    canvas.classList.toggle('px', !!S.ps1);
    AudioSys.setVolume(S.volume);
    const sh = S.shadows !== 'off';
    const size = S.shadows === 'high' ? 1024 : 512;
    const changed = renderer.shadowMap.enabled !== sh || PLAYER.flash.shadow.mapSize.x !== size;
    renderer.shadowMap.enabled = sh; PLAYER.flash.castShadow = sh;
    if (PLAYER.flash.shadow.mapSize.x !== size) { PLAYER.flash.shadow.mapSize.set(size, size); if (PLAYER.flash.shadow.map) { PLAYER.flash.shadow.map.dispose(); PLAYER.flash.shadow.map = null; } }
    if (changed && recompile) { const seen = new Set(); for (const sc of [WORLD.scene, LOBBY.scene]) sc.traverse((o) => { if (o.material && !seen.has(o.material)) { seen.add(o.material); o.material.needsUpdate = true; } }); }
    $('#fps').style.display = S.showFps ? 'block' : 'none';
    $('#fx-grain').classList.toggle('off', !S.grain);
  },
  adapt(dt) {
    this.fpsAcc += dt; this.fpsN++;
    if (this.fpsAcc < 2) return;
    const fps = this.fpsN / this.fpsAcc; this.fpsAcc = 0; this.fpsN = 0; this.lastFps = fps;
    if (SAVE.settings.showFps) $('#fps').textContent = `${fps.toFixed(0)} fps · ${Math.round(this.scale * 100)}% · ${renderer.info.render.calls} calls`;
    if (SAVE.settings.quality !== 'auto' || document.hidden) return;
    this.fpsHist.push(fps); if (this.fpsHist.length > 3) this.fpsHist.shift();
    if (fps < 48 && this.scale > 0.4) { this.scale = Math.max(0.4, this.scale - (fps < 35 ? 0.15 : 0.08)); this.applyScale(); this.fpsHist = []; }
    else if (this.fpsHist.length === 3 && this.fpsHist.every((f) => f > 58) && this.scale < 0.85) { this.scale = Math.min(0.85, this.scale + 0.05); this.applyScale(); this.fpsHist = []; }
  },
  update(dt) {
    NET.tick(dt);
    if (this.state === 'game') {
      const coop = NET.role === 'client' || NET.guestCount() > 0;
      if (!this.paused || coop) { GAME.frame++; GAME.update(dt); if (!this.paused) HUD.update(dt); }
      AudioSys.listen(camera);
    } else if (this.state === 'title' || this.state === 'loading') {
      this.titleT += dt;
      const t = this.titleT * 0.05;
      camera.position.set(7.0 + Math.sin(t) * 6.0, 2.1 + Math.sin(t * 1.7) * 0.25, 23.0 + Math.cos(t * 0.8) * 0.4);
      camera.lookAt(7.0 + Math.sin(t) * 2.5, 1.6, 12);
      camera.updateMatrixWorld();
      PLAYER.flash.intensity = 0;
      if (chance(dt * 0.15)) GAME.flickerRoom(ROOM.boys, rand(0.3, 1.2));
      GAME.lighting(dt);
    } else if (this.state === 'lobby' || this.state === 'results') {
      LOBBY.t += dt;
      LOBBY.cam.position.set(103.5 + Math.sin(LOBBY.t * 0.15) * 0.4, 1.6 + Math.sin(LOBBY.t * 0.3) * 0.03, 105.0);
      LOBBY.cam.lookAt(103.5 + Math.sin(LOBBY.t * 0.11) * 0.6, 1.45, 100);
      GAME.lighting(dt);
    }
  },
  render() {
    if (this.state === 'lobby' || this.state === 'results' && !GAME.active) { renderer.render(LOBBY.scene, LOBBY.cam); return; }
    // van CCTV feed (only while the player is in the van)
    if (this.state === 'game' && PLAYER.room && PLAYER.room.id === 'van' && GAME.frame % 3 === 0) {
      const cams = ITEM_LIST.filter((it) => it.type === 'video' && it.where === 'world');
      const scr = VAN.screens.cctv;
      const c = cams[GAME.camIdx % Math.max(1, cams.length)];
      if (c && c.on) { NV.render(WORLD.scene, c.mesh, NV.cctvRT, 16 / 9); if (scr.mat.map !== NV.cctvRT.texture) { scr.mat.map = NV.cctvRT.texture; scr.mat.needsUpdate = true; } scr.mat.color.set(0x9dff9d); }
      else if (scr.mat.map) { scr.mat.map = null; scr.mat.needsUpdate = true; scr.mat.color.set(0x0a140c); }
    }
    renderer.render(WORLD.scene, camera);
    if (GAME.pendingPhoto) GAME.capturePhoto();
  },
};

// ---------------------------------------------------------------- INPUT -----
document.addEventListener('pointerlockchange', () => {
  INPUT.locked = document.pointerLockElement === canvas;
  if (INPUT.locked) INPUT.lockedAt = performance.now();
  if (INPUT.locked) { $('#lockhint').classList.remove('on'); INPUT.expectUnlock = false; return; }
  if (APP.state !== 'game') return;
  if (INPUT.expectUnlock) { INPUT.expectUnlock = false; return; }
  if (!JOURNAL.open && !GAME.ending && !PLAYER.dead) APP.setPaused(true);
});
document.addEventListener('pointerlockerror', () => { if (APP.state === 'game' && !APP.paused && !JOURNAL.open) $('#lockhint').classList.add('on'); });
$('#lockhint').addEventListener('click', () => { $('#lockhint').classList.remove('on'); AudioSys.init(); APP.askLock(); });
canvas.addEventListener('click', () => { AudioSys.init(); if (APP.state === 'game' && !INPUT.locked && !APP.paused && !JOURNAL.open) APP.askLock(); });
document.addEventListener('mousemove', (e) => {
  if (!INPUT.locked || APP.state !== 'game' || APP.paused || PLAYER.dead) return;
  // Chrome sometimes reports a huge jump right after the pointer locks
  if (performance.now() - INPUT.lockedAt < 120 || Math.abs(e.movementX) > 300 || Math.abs(e.movementY) > 300) return;
  const k = 0.0022 * SAVE.settings.sens;
  PLAYER.yaw -= e.movementX * k;
  PLAYER.pitch = clamp(PLAYER.pitch - e.movementY * k * (SAVE.settings.invertY ? -1 : 1), -1.45, 1.45);
});
document.addEventListener('mousedown', (e) => {
  if (!INPUT.locked || APP.state !== 'game' || APP.paused || PLAYER.dead) return;
  if (e.button === 0) { if (!PLAYER.held()) { interactPressed(); return; } useHeld(); }
  else if (e.button === 2) { if (!toggleAimedItem()) useHeld(); }
});
document.addEventListener('contextmenu', (e) => { if (APP.state === 'game') e.preventDefault(); });
document.addEventListener('wheel', (e) => {
  if (!INPUT.locked || APP.state !== 'game' || APP.paused) return;
  selectSlot((PLAYER.sel + (e.deltaY > 0 ? 1 : 2)) % 3);
}, { passive: true });
document.addEventListener('keydown', (e) => {
  if (APP.state !== 'game') return;
  if (e.target && e.target.tagName === 'INPUT') return;
  const c = e.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'Tab'].includes(c)) e.preventDefault();
  if (c === 'Escape') { if (JOURNAL.open) { JOURNAL.hide(); return; } if (INPUT.talkOpen) { HUD.hideTalk(); return; } if ($('#modal').classList.contains('on')) { UI.closeModal(); return; } if (APP.paused) { APP.setPaused(false); APP.askLock(); } return; }
  if (APP.paused || PLAYER.dead || GAME.ending) return;
  if (c === 'KeyJ') { JOURNAL.open ? JOURNAL.hide() : JOURNAL.show(); return; }
  if (JOURNAL.open) return;
  KEYS[c] = true;
  if (e.repeat) return;
  if (INPUT.talkOpen && /^Digit[1-7]$/.test(c)) { GAME.say(PHRASES[+c.slice(5) - 1].k); HUD.hideTalk(); return; }
  switch (c) {
    case 'KeyT': INPUT.talkOpen ? HUD.hideTalk() : HUD.showTalk(); break;
    case 'Digit1': case 'Digit2': case 'Digit3': selectSlot(+c.slice(5) - 1); break;
    case 'KeyQ': selectSlot((PLAYER.sel + 1) % 3); break;
    case 'KeyE': interactPressed(); break;
    case 'KeyG': dropHeld(); break;
    case 'KeyF': PLAYER.flashOn = !PLAYER.flashOn; SFX.toggle(PLAYER.flashOn); break;
    case 'KeyR': if (!toggleAimedItem()) useHeld(); break;
  }
});
document.addEventListener('keyup', (e) => { KEYS[e.code] = false; });
window.addEventListener('blur', () => { for (const k in KEYS) KEYS[k] = false; });
window.addEventListener('resize', () => APP.applyScale());

// clicks on menus, lobby, modal, journal, results
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act],[data-close],[data-diff],[data-buy],[data-ev],[data-guess],[data-jtab],[data-gtab],[data-jclose],[data-jlevel]');
  if (!t) { if (e.target.id === 'modal') UI.closeModal(); return; }
  AudioSys.init(); SFX.ui();
  if (t.dataset.close !== undefined) { UI.closeModal(); return; }
  if (t.dataset.diff) { if (NET.role === 'client') return; SAVE.diff = t.dataset.diff; persist(); NET.lobbyChanged(); lobbyRender(); return; }
  if (t.dataset.buy) {
    const id = t.dataset.buy, it = ITEMS[id], p = SAVE.profile;
    if (p.money >= it.price) { p.money -= it.price; p.owned[id]++; persist(); lobbyRender(); }
    return;
  }
  if (t.dataset.ev) { const m = GAME.marks[t.dataset.ev] || 0; GAME.marks[t.dataset.ev] = m === 0 ? 1 : m === 1 ? -1 : 0; JOURNAL.render(); return; }
  if (t.dataset.guess) { GAME.guess = GAME.guess === t.dataset.guess ? null : t.dataset.guess; JOURNAL.render(); return; }
  if (t.dataset.jtab) { JOURNAL.tab = t.dataset.jtab; JOURNAL.render(); return; }
  if (t.dataset.gtab) { JOURNAL.ghostTab = t.dataset.gtab; JOURNAL.render(); return; }
  if (t.dataset.jlevel !== undefined) { JOURNAL.mapLevel = JOURNAL.mapLevel ? 0 : 1; JOURNAL.render(); return; }
  if (t.dataset.jclose !== undefined) { JOURNAL.hide(); return; }
  switch (t.dataset.act) {
    case 'play': APP.setState('lobby'); break;
    case 'menu': APP.setState('title'); break;
    case 'lobby': $('#fade').style.opacity = 0; APP.setState('lobby'); break;
    case 'start': APP.startContract(); break;
    case 'copylink': {
      const el = $('#invite'), link = NET.inviteLink();
      const done = () => HUD.toast('Invite link copied — send it to your friends');
      const fallback = () => { if (el) { el.focus(); el.select(); try { document.execCommand('copy'); done(); } catch (e2) { HUD.toast('Select the link and copy it (Ctrl+C)'); } } };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, fallback); else fallback();
      break;
    }
    case 'join': NET.join($('#joincode') ? $('#joincode').value : ''); break;
    case 'leavelobby': NET.leave(); break;
    case 'ready': NET.setReady(!NET.ready); lobbyRender(); break;
    case 'rejoin': NET.send(NET.conn, { t: 'rejoin' }); break;
    case 'howto': UI.howto(); break;
    case 'guide': UI.guide(); break;
    case 'about': UI.about(); break;
    case 'settings': UI.settings(); break;
    case 'resume': APP.setPaused(false); APP.askLock(); break;
    case 'journal': APP.setPaused(false); JOURNAL.show(); break;
    case 'abandon':
      APP.setPaused(false);
      // a guest quits to the lobby but stays in their friend's game, so they can rejoin
      if (NET.role === 'client') { NET.action({ k: 'quit' }); NET.ready = false; GAME.abortClient('You left the contract. Click “Rejoin contract” to go back in.'); break; }
      GAME.ending = true; $('#fade').style.opacity = 1; setTimeout(() => GAME.finish(false), 600); break;
    case 'reset':
      if (confirm('Reset your money, level and equipment?')) { SAVE.profile = freshProfile(); persist(); lobbyRender(); UI.closeModal(); }
      break;
  }
});
document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.set; if (!k) return;
  const S = SAVE.settings, el = e.target;
  if (el.type === 'checkbox') S[k] = el.checked;
  else if (el.type === 'range') { S[k] = parseFloat(el.value); el.nextElementSibling && (el.nextElementSibling.textContent = k === 'volume' || k === 'bright' ? Math.round(S[k] * 100) + '%' : S[k]); }
  else S[k] = el.value;
  if (k === 'quality' && S.quality === 'auto') APP.scale = 0.7;
  persist(); APP.applySettings(true);
  const cs = $('#cur-scale'); if (cs) cs.textContent = Math.round(APP.scale * 100) + '%';
});
// your name is saved as you type and sent to the lobby a moment after you stop
let nameT = null;
document.addEventListener('input', (e) => {
  if (e.target.id !== 'pname') return;
  SAVE.profile.name = cleanName(e.target.value); persist();
  clearTimeout(nameT);
  nameT = setTimeout(() => { if (NET.role === 'client') NET.send(NET.conn, { t: 'name', name: SAVE.profile.name }); else NET.lobbyChanged(); lobbyRender(); }, 600);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'joincode') NET.join(e.target.value); });
document.addEventListener('visibilitychange', () => { if (document.hidden && APP.state === 'game' && !APP.paused && !PLAYER.dead) APP.setPaused(true); });

// ---------------------------------------------------------------- MAIN ------
async function init() {
  setLoad('Painting textures…', 0.25); await nextFrame();
  makeTextures(); makeMaterials(); makeDecalTextures(); initRooms();
  setLoad('Building 6 Tanglewood Drive…', 0.45); await nextFrame();
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x03050a);
  scene.fog = new THREE.FogExp2(0x03050a, 0.045);
  buildHouse(scene);
  scene.add(camera);
  const handLight = new THREE.PointLight(0xfff2dc, 0.045, 1.0, 2); handLight.position.set(0.05, 0.08, -0.05); camera.add(handLight);
  PLAYER.torch = buildTorch(); PLAYER.hand.add(PLAYER.torch.group);
  GAME.bone = buildBone(scene); GAME.bone.visible = false;
  ORBS.init(scene); PARTICLES.init(scene); NV.init();
  placeFuseBox('garage');
  setLoad('Setting up the lobby…', 0.65); await nextFrame();
  buildLobby();
  if (SAVE.settings.quality !== 'auto') APP.scale = parseFloat(SAVE.settings.quality);
  APP.applySettings(false);
  setLoad('Compiling shaders…', 0.8); await nextFrame();
  APP.titleAmbience(); GAME.lighting(0.016);
  try { renderer.compile(scene, camera); renderer.compile(LOBBY.scene, LOBBY.cam); } catch (e) { console.warn(e); }
  setLoad('Ready', 1); await nextFrame();
  $('#screen-load').classList.remove('on');
  APP.setState('title');
  // everyone's game is online as a lobby; ?join=CODE (the invite link) joins a friend's
  const qs = new URLSearchParams(location.search), joinCode = qs.get('join');
  if (qs.has('nonet')) NET.disabled = true;
  if (joinCode && !NET.disabled) { APP.setState('lobby'); NET.join(joinCode); }
  else NET.host();
  // ?debug exposes internals for automated tests and tinkering in the console
  if (new URLSearchParams(location.search).has('debug')) window.PHASMO = { THREE, GAME, PLAYER, WORLD, APP, ROOMS, ROOM, ITEM_LIST, VAN, NAV, camera, renderer, useHeld, dropHeld, interactPressed, selectSlot, pickUpItem, JOURNAL, AIM, updateAim, SAVE, NET, REMOTES, PL, KEYS, toggleAimedItem, buildGhostModel, buildAvatar, DOTS, U };
  // ?norender runs the game without drawing (for automated multi-player tests)
  APP.noDraw = new URLSearchParams(location.search).has('norender');
  let last = performance.now(), lastFrame = last;
  const step = (draw) => {
    const now = performance.now(), dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    APP.update(dt); if (draw && !APP.noDraw) APP.render(); APP.adapt(dt);
  };
  const frame = () => { requestAnimationFrame(frame); lastFrame = performance.now(); step(true); };
  requestAnimationFrame(frame);
  // Browsers stop drawing frames in a background tab. In co-op the game keeps
  // running anyway (a worker's timer isn't paused), so friends aren't frozen
  // when the host switches tabs.
  try {
    const w = new Worker(URL.createObjectURL(new Blob(['setInterval(() => postMessage(0), 50);'], { type: 'text/javascript' })));
    w.onmessage = () => { if (performance.now() - lastFrame > 250 && NET.role !== 'solo' && (NET.role === 'client' || NET.guestCount())) step(false); };
  } catch (e) { /* no workers: co-op pauses with the tab */ }
  addEventListener('pagehide', () => NET.bye());
}
init().catch((e) => { console.error(e); setLoad('Something went wrong: ' + e.message); $('#screen-load').classList.add('on'); });
</script>
</body>
